<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Googleフォトリンク集</title>
<style>
  :root{
    --violet-950:#2e1065; --violet-900:#3b1470; --violet-700:#6d28d9; --violet-600:#7c3aed;
    --violet-100:#ede9fe; --violet-50:#f5f3ff;
    --ink:#241b33; --ink-soft:#6f6484; --line:#e7def7;
    --bg:#f4f1fa; --card:#ffffff;
    --shadow:0 10px 30px rgba(76,29,149,.10), 0 2px 6px rgba(76,29,149,.06);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(600px 300px at 110% -60px, rgba(124,58,237,.14), transparent 60%),
      radial-gradient(500px 260px at -10% 120px, rgba(76,29,149,.10), transparent 60%),
      var(--bg);
    color:var(--ink); line-height:1.65; min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  /* ---------- hero ---------- */
  .hero{
    position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(135deg, var(--violet-950) 0%, #4c1d95 46%, var(--violet-600) 115%);
    padding:calc(30px + env(safe-area-inset-top)) 20px 58px;
  }
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
  .hero::before{width:230px;height:230px;right:-70px;top:-90px;background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.35), rgba(255,255,255,0) 65%)}
  .hero::after{width:170px;height:170px;left:-50px;bottom:-95px;background:radial-gradient(circle at 40% 40%, rgba(196,181,253,.5), rgba(196,181,253,0) 65%)}
  .hero-inner{position:relative;z-index:1;max-width:960px;margin:0 auto}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#ddd6fe;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;backdrop-filter:blur(6px)}
  .hero h1{font-size:1.9rem;font-weight:800;letter-spacing:.04em;margin:14px 0 8px;line-height:1.3}
  .hero p{font-size:.9rem;color:#e9e4fb;max-width:34em}
  .hero-count{display:inline-flex;align-items:baseline;gap:6px;margin-top:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 14px}
  .hero-count strong{font-size:1.3rem;font-weight:800}
  .hero-count span{font-size:.78rem;color:#ddd6fe}
  /* ---------- sticky controls ---------- */
  .controls{
    position:sticky; top:0; z-index:50;
    margin:-34px auto 4px; max-width:960px; padding:0 14px;
  }
  .controls-card{
    background:rgba(255,255,255,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.7); border-radius:20px; box-shadow:var(--shadow); padding:12px;
  }
  .search{position:relative}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--violet-600);pointer-events:none}
  .search input{
    width:100%; padding:13px 40px 13px 42px; font-size:1rem; color:var(--ink);
    border:1.5px solid var(--line); border-radius:999px; background:#fff; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:var(--violet-600); box-shadow:0 0 0 4px rgba(124,58,237,.15)}
  .search input::placeholder{color:#a294c0}
  .clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:50%;background:var(--violet-100);color:var(--violet-900);font-size:1rem;line-height:1;cursor:pointer;display:none}
  .chip-row{display:flex;gap:8px;margin-top:11px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--violet-950);border-radius:999px;padding:7px 15px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
  .chip.active{background:linear-gradient(135deg,var(--violet-700),var(--violet-600));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(109,40,217,.35)}
  .month-row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .month-row label{font-size:.78rem;color:var(--ink-soft);font-weight:600}
  .month-row select{flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:.9rem;background:#fff;color:var(--ink);outline:none}
  .match-note{font-size:.78rem;color:var(--ink-soft);text-align:right;margin-top:8px;min-height:1.2em}
  /* ---------- list ---------- */
  .main{max-width:960px;margin:0 auto;padding:10px 14px 0}
  .month-head{display:flex;align-items:baseline;gap:10px;margin:24px 4px 12px}
  .month-head h2{font-size:1.05rem;font-weight:800;color:var(--violet-950);letter-spacing:.03em}
  .month-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .month-head span{font-size:.75rem;color:var(--ink-soft)}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{
    display:block;background:var(--card);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;
    box-shadow:var(--shadow); border:1px solid rgba(231,222,247,.9);
    transition:transform .18s ease, box-shadow .18s ease; animation:rise .45s ease both;
  }
  .card:active{transform:scale(.985)}
  @media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(76,29,149,.16),0 4px 10px rgba(76,29,149,.08)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .thumb-wrap{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--violet-100),#ddd6fe);overflow:hidden}
  .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,16,101,0) 55%,rgba(46,16,101,.38))}
  .pill{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:999px;color:#fff;background:rgba(30,10,66,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25)}
  .pill.date{left:10px;top:10px}
  .pill.count{right:10px;bottom:10px}
  .card-body{padding:14px 16px 16px}
  .cat{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--violet-700);background:var(--violet-100);border-radius:6px;padding:3px 8px;margin-bottom:7px}
  .title{font-size:1.02rem;font-weight:700;line-height:1.45;word-break:break-word}
  .title .vs{color:var(--ink-soft);font-weight:600}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--ink-soft)}
  .open{color:var(--violet-700);font-weight:700;display:inline-flex;align-items:center;gap:3px}
  .empty{display:none;text-align:center;background:#fff;border:1.5px dashed var(--line);border-radius:var(--radius);padding:44px 20px;color:var(--ink-soft)}
  .empty .big{font-size:1.6rem;margin-bottom:6px}
  footer{max-width:960px;margin:34px auto 0;padding:0 20px;text-align:center;font-size:.75rem;color:#a294c0}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <span class="hero-eyebrow">Photo Albums</span>
    <h1>Googleフォトリンク集</h1>
    <p>アルバムをタップすると写真をご覧いただけます。キーワード検索や分類・年月での絞り込みもできます。</p>
    <div class="hero-count"><strong id="totalCount">0</strong><span>アルバム</span></div>
  </div>
</header>

<div class="controls">
  <div class="controls-card">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
      <input type="text" id="searchInput" placeholder="相手名・イベント名・日付で検索" autocomplete="off">
      <button class="clear-btn" id="clearBtn" aria-label="検索をクリア">×</button>
    </div>
    <div class="chip-row" id="catChips"></div>
    <div class="month-row">
      <label for="monthSelect">年月</label>
      <select id="monthSelect"><option value="">すべて</option></select>
    </div>
    <div class="match-note" id="matchCount"></div>
  </div>
</div>

<main class="main" id="main"></main>
<div class="main"><div class="empty" id="empty"><div class="big">🔍</div>該当するアルバムが見つかりませんでした。</div></div>

// ===== タイトルの命名規則から日付・分類・対戦相手を自動判定 =====
function parseAlbum(a){
  const m = a.title.match(/^(\d{4})(\d{2})(\d{2})_(.+)$/);
  let date = "", ym = "", ymLabel = "", rest = a.title;
  if (m){ date = `${m[1]}-${m[2]}-${m[3]}`; ym = `${m[1]}-${m[2]}`; ymLabel = `${m[1]}年${Number(m[2])}月`; rest = m[4]; }
  let category = "その他", opponent = "";
  const vs = rest.match(/^(.*?)_vs(.+)$/);
  if (vs){ category = vs[1]; opponent = vs[2]; } else { category = rest; }
  const displayTitle = opponent ? `${category} <span class="vs">vs</span> ${opponent}` : a.title.replace(/^\d{8}_/, "");
  return { ...a, date, ym, ymLabel, category, opponent, displayTitle };
}
const albums = ALBUMS.map(parseAlbum).sort((x,y)=> y.date.localeCompare(x.date));
let activeCat = "";
const $ = id => document.getElementById(id);
function renderChips(){
  const cats = ["", ...new Set(albums.map(a=>a.category))];
  $('catChips').innerHTML = cats.map(c =>
    `<button class="chip ${c===activeCat?'active':''}" data-cat="${c}">${c===""?"すべて":c}</button>`).join("");
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { activeCat = ch.dataset.cat; renderChips(); apply(); });
  const months = [...new Set(albums.map(a=>a.ym).filter(Boolean))].sort().reverse();
  const sel = $('monthSelect'); const cur = sel.value;
  sel.innerHTML = '<option value="">すべて</option>' + months.map(m=>{
    const a = albums.find(x=>x.ym===m); return `<option value="${m}">${a.ymLabel}</option>`;
  }).join("");
  sel.value = cur;
}
function apply(){
  const q = $('searchInput').value.toLowerCase().trim();
  const ym = $('monthSelect').value;
  $('clearBtn').style.display = q ? "block" : "none";
  const filtered = albums.filter(a =>
    (!activeCat || a.category === activeCat) &&
    (!ym || a.ym === ym) &&
    (!q || (a.title + " " + a.date + " " + a.category + " " + a.opponent).toLowerCase().includes(q))
  );
  const groups = new Map();
  filtered.forEach(a => { if (!groups.has(a.ym)) groups.set(a.ym, {label:a.ymLabel, items:[]}); groups.get(a.ym).items.push(a); });
  $('main').innerHTML = [...groups.values()].map(g => `
    <div class="month-head"><h2>${g.label}</h2><div class="rule"></div><span>${g.items.length}件</span></div>
    <div class="grid">
      ${g.items.map((a,i) => `
      <a class="card" style="animation-delay:${Math.min(i*60,300)}ms" href="${a.url}" target="_blank" rel="noopener noreferrer">
        <div class="thumb-wrap">
          ${a.thumb ? `<img src="${a.thumb}" alt="" loading="lazy">` : ""}
          <span class="pill date">📅 ${a.date}</span>
          <span class="pill count">📷 ${a.count}枚</span>
        </div>
        <div class="card-body">
          <span class="cat">${a.category}</span>
          <div class="title">${a.displayTitle}</div>
          <div class="meta"><span>${a.date.replace(/-/g,".")}</span><span class="open">写真を見る ›</span></div>
        </div>
      </a>`).join("")}
    </div>`).join("");
  $('totalCount').textContent = albums.length;
  $('matchCount').textContent = (q || ym || activeCat) ? `表示中 ${filtered.length} 件` : "";
  $('empty').style.display = filtered.length ? "none" : "block";
}
$('searchInput').addEventListener('input', apply);
$('monthSelect').addEventListener('change', apply);
$('clearBtn').onclick = () => { $('searchInput').value = ""; apply(); };
renderChips(); apply();
</script>
</body>
</html>
